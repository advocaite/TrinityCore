[worldserver]
###################################################################################################
# WoW Forever Bots - LOOKING FOR GROUP (Group Finder) SETTINGS
# The bots build puts this file into worldserver.conf.d\ if it is not there yet (an existing copy is never overwritten).
# When a player posts a dungeon listing in the Group Finder, the bots can fill the missing tank, healer and damage places
# with that player's own level-matched companions. Real players always come first. Edit the values and restart.
###################################################################################################

# Group Finder bot fill on (1) or off (0).
Playerbot.Lfg.Enable = 1

# The longest the bots wait for real players after a listing is posted, in seconds (0-3600). 0 = never fill.
Playerbot.Lfg.BotFillSeconds = 180

# 1 = do not wait when nobody could join. Right after the post and then every 15 seconds the server counts the real
# (non-bot) players online of the same faction, within LevelRange levels of the listing player, who are not in a full group
# and are either not grouped or have a listing of their own. If that count is 0 the bots come at once. 0 = always wait
# the full BotFillSeconds.
Playerbot.Lfg.InstantFillIfNobody = 0

# 1 = while the wait runs the bots arrive one at a time, evenly spread so the last one comes when BotFillSeconds is up, like
# players joining. Real players who join meanwhile take a place first and the bots needed shrink. 0 = all bots at the end.
Playerbot.Lfg.Trickle = 1

# Real players within +/- this many levels of the listing player count as available (0-80).
Playerbot.Lfg.LevelRange = 5

# Group Finder activity id -> map id, comma separated "activity:map" or "activity:map:size". The group is filled to the party size:
# the size when the entry has one (Upper Blackrock Spire, map 229 = 10: 1 tank, 3 healers, 6 damage), the player limit of the map for
# a raid (20, 40), a 5-man for any other dungeon. A group bigger than 5 is turned into a raid first. The activity id of each posted
# listing is in Playerbot.log as "[lfg] listing ... activities=N" (the Group Finder id times 256); an activity not listed fills a 5-man.
Playerbot.Lfg.ActivityMaps = 203776:43,204032:289,204288:389,204544:36,204800:33,205056:48,205312:34,205568:90,205824:47,206080:189,206336:129,206592:70,206848:209,207104:349,207360:109,207616:230,207872:229,208128:429,208384:429,208640:429,208896:329,211712:189,211968:189,212224:189,214272:229:10,214016:309,214528:249,214784:409,215040:469,215296:533,215552:509,215808:531

# Group Finder categories that count (comma separated ids; the id of each posted listing is in Playerbot.log as
# "[lfg] listing ... category=N"). Empty = every category.
Playerbot.Lfg.Categories =

###################################################################################################
# BOT GROUPS IN THE LIST
# Groups of bots (a tank, healers and damage dealers of one faction) show in the Group Finder list for the dungeons below, mostly
# with a place or two open (often a healer or a tank) so they look like groups that are still forming. A player signs up with the
# Group Invite button, or by inviting a member (/invite name): the player joins, takes the lead, and the bots follow like their
# companions. A group nobody joins is taken down again after a few minutes and its bots go back to their own life; a new one takes
# its place. Groups are only made while a player of that faction is online, and fewer of them in the small hours.
###################################################################################################

# The most groups listed per faction at the busiest hour (evening); at night about a quarter of that. 0 = no bot groups. A dungeon
# without a group of the faction is always served first, so 25 gives every dungeon a group (a dungeon needs free bots of its level range).
Playerbot.Lfg.BotGroups.Max = 25

# The most bots held in listed groups at once (their RAM is about 4 MB each).
Playerbot.Lfg.BotGroups.MaxBots = 150

# Minutes a group stays listed (a random time between the two).
Playerbot.Lfg.BotGroups.MinMinutes = 5
Playerbot.Lfg.BotGroups.MaxMinutes = 20

# Seconds between two new groups while the list holds fewer than it should.
Playerbot.Lfg.BotGroups.IntervalSeconds = 30

# Dungeons the groups are for, comma separated "activity:map:minLevel:maxLevel": the Group Finder activity id, the dungeon's map
# id and the level range of the bots that form the group. An optional fifth number is the party size (5 when left out; Upper Blackrock Spire is 10). The activity id of
# a dungeon is in Server.log when it is picked in the Looking For Group filter ("GroupFinder: search ... activities [N]"; the
# listing carries N times 256, Upper Blackrock Spire 837 = 214272).
Playerbot.Lfg.BotGroups.Activities = 203776:43:15:24,204032:289:58:60,204288:389:13:18,204544:36:17:26,204800:33:20:30,205056:48:24:32,205312:34:24:32,205568:90:29:38,205824:47:29:38,206080:189:30:38,206336:129:37:46,206592:70:41:51,206848:209:44:54,207104:349:46:55,207360:109:50:60,207616:230:52:60,207872:229:55:60,208128:429:54:60,208384:429:56:60,208640:429:56:60,208896:329:58:60,211712:189:36:44,211968:189:38:46,212224:189:33:41,214272:229:59:60:10

# The category the groups are listed in until the server has seen one of your own dungeon listings (it then uses that category).
Playerbot.Lfg.BotGroups.Category = 2

###################################################################################################
# DUNGEON FINDER (.bot dungeon, the add-on's Dungeon... button)
# A player picks a dungeon of the list above (or "any" for their level). The missing tank, healer and damage places are filled with
# their own companions at their level, and once the group is complete the player is put inside the dungeon's door and the bots
# are brought after them. ".bot dungeon leave" takes them back to where they queued.
###################################################################################################

# Dungeon finder on (1) or off (0).
Playerbot.Lfg.Finder.Enable = 1

# The door a dungeon is entered by, comma separated "activity:areatrigger" (an areatrigger_teleport id). Empty = the built-in doors
# (each dungeon's own entrance; the wing's own door for Scarlet Monastery and Dire Maul). Example: 208896:2214 enters Stratholme by the
# Service Gate.
Playerbot.Lfg.Finder.Entrances =
